services:
  jelly-diff:
    image: ghcr.io/eiffelbeef/jelly-diff:latest
    restart: unless-stopped
    container_name: jelly-diff
    ports:
      - "6363:6363"
    volumes:
      - ./data:/data
    environment:
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-1h}
      - MIN_SYNC_INTERVAL=${MIN_SYNC_INTERVAL:-10m}
      - DB_PATH=/data/jelly-diff.db
      - LISTEN_ADDR=:6363
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_TYPE=${WEBHOOK_TYPE:-generic}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6363/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
